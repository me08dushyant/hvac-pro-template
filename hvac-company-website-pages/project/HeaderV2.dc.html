<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
body { margin: 0; background: #F5F6F8; }
a { color: #0B0D14; text-decoration: none; }
a:hover { color: #1B4DFF; }
</style>
</helmet>
<div style="font-family:'Instrument Sans',sans-serif">
  <div style="background:#0B0D14;color:#8A93A6;font-family:'JetBrains Mono',monospace;font-size:12px;overflow:hidden">
    <div style="max-width:1320px;margin:0 auto;padding:9px 32px;display:flex;gap:36px;align-items:center;white-space:nowrap">
      <span style="color:#1B4DFF">● LIVE</span>
      <span>ISO CLASS <span style="color:#fff">7</span></span>
      <span>ΔP <span style="color:#fff">{{ dp }} Pa</span></span>
      <span>T <span style="color:#fff">{{ temp }} °C</span></span>
      <span>RH <span style="color:#fff">{{ rh }} %</span></span>
      <span>PARTICLES ≥0.5µm <span style="color:#fff">{{ particles }} /m³</span></span>
      <span style="margin-left:auto;color:#FF3B2F">DHAKA · GAZIPUR</span>
    </div>
  </div>
  <header style="position:sticky;top:0;z-index:60;background:rgba(245,246,248,.9);backdrop-filter:blur(12px);border-bottom:1px solid #E1E3E9">
    <div style="max-width:1320px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;gap:40px">
      <a href="Home.dc.html" style="display:flex;align-items:baseline;gap:10px;white-space:nowrap">
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.04em">HVACPro</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#5A6272">EST. 2018</span>
      </a>
      <nav style="display:flex;flex-wrap:wrap;gap:28px;font-size:15px;font-weight:500;margin-left:12px;min-width:0">
        <a href="Services.dc.html">Services</a>
        <a href="Products.dc.html">Equipment</a>
        <a href="Industries.dc.html">Sectors</a>
        <a href="Projects.dc.html">Work</a>
        <a href="About.dc.html">Firm</a>
        <a href="Team.dc.html">Team</a>
        <a href="Careers.dc.html">Careers</a>
      </nav>
      <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
        <a href="Certifications.dc.html" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#5A6272;white-space:nowrap">COMPLIANCE →</a>
        <a href="Contact.dc.html" style="padding:11px 20px;background:#FF3B2F;color:#fff;font-size:14px;font-weight:600;border-radius:2px;white-space:nowrap" style-hover="background:#0B0D14">Request a quote</a>
      </div>
    </div>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { dp: 15.2, temp: 21.4, rh: 46, particles: 1840 };
  componentDidMount() {
    const j = (v, amt, lo, hi) => Math.min(hi, Math.max(lo, v + (Math.random() - 0.5) * amt));
    this._t = setInterval(() => this.setState(s => ({
      dp: Math.round(j(s.dp, 0.6, 14.2, 16.4) * 10) / 10,
      temp: Math.round(j(s.temp, 0.3, 20.8, 22.2) * 10) / 10,
      rh: Math.round(j(s.rh, 1.2, 43, 49)),
      particles: Math.round(j(s.particles, 260, 1100, 2600) / 10) * 10
    })), 2200);
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    return {
      dp: this.state.dp.toFixed(1),
      temp: this.state.temp.toFixed(1),
      rh: this.state.rh,
      particles: this.state.particles.toLocaleString("en-US")
    };
  }
}
</script>
</body>
</html>
